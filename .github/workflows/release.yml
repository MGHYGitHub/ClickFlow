name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag matching Directory.Build.props, for example v3.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate version and release notes
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'The tag must match the stable version in Directory.Build.props.'
          }
          if (-not (Test-Path -LiteralPath "docs/releases/$env:RELEASE_TAG.md")) {
            throw 'Write docs/releases/<tag>.md before publishing.'
          }
          $existingCommit = git rev-parse --verify --quiet "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -eq 0 -and $existingCommit -ne $env:GITHUB_SHA) {
            throw 'The tag already points to a different commit.'
          }
          $global:LASTEXITCODE = 0
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Smoke test standalone EXE
        shell: pwsh
        run: |
          $dataPath = Join-Path $env:RUNNER_TEMP 'clickflow-smoke'
          $app = Start-Process ./artifacts/publish/win-x64/ClickFlow.exe -ArgumentList "--smoke-test --data-dir `"$dataPath`"" -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Smoke test timed out.' }
          if ($app.ExitCode -ne 0 -or (Test-Path "$dataPath/errors.log") -or -not (Test-Path "$dataPath/workflow.json")) {
            throw 'Standalone EXE smoke test failed.'
          }
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClickFlow-${{ inputs.tag }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "ClickFlow $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Creating or uploading the draft release failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; inspect the draft release.' }
